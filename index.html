<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="expires" content="0">
<title>树与狸 · 拼筑家</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#f6f1e8;overflow:hidden;}
  main#stage{position:fixed;inset:0;}
  /* 三屏始终占据真实布局尺寸（iframe 永不 0 尺寸）；非当前屏仅视觉隐藏且不拦截指针 */
  .screen{position:absolute;inset:0;visibility:hidden;opacity:.001;pointer-events:none;}
  .screen.active{visibility:visible;opacity:1;pointer-events:auto;animation:popIn .42s cubic-bezier(.22,.9,.3,1);z-index:2;}
  .screen iframe{display:block;width:100%;height:100%;border:0;background:transparent;}
  @keyframes popIn{from{opacity:0;transform:scale(1.015);}to{opacity:1;transform:scale(1);}}
  @media (prefers-reduced-motion: reduce){.screen.active{animation:none;}}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
</style>
</head>
<body>
<main id="stage">
  <h1 class="sr-only">树与狸 · 拼筑家</h1>
  <section class="screen active" id="screen1" aria-label="第一屏：树与狸首页">
    <iframe id="frame1" title="树与狸首页" allow="autoplay; fullscreen" src="page1.html"></iframe>
  </section>
  <section class="screen" id="screen2" aria-label="第二屏：灵感碰撞">
    <iframe id="frame2" title="灵感碰撞" allow="autoplay; fullscreen"></iframe>
  </section>
  <section class="screen" id="screen3" aria-label="第三屏：共创画廊">
    <iframe id="frame3" title="共创画廊" allow="autoplay; fullscreen"></iframe>
  </section>
</main>
<script>
(function(){
  var boxes=[document.getElementById('screen1'),document.getElementById('screen2'),document.getElementById('screen3')];
  var frames=[document.getElementById('frame1'),document.getElementById('frame2'),document.getElementById('frame3')];
  var srcs=['page1.html','page2.html','page3.html'];
  var loaded=[true,false,false];
  function fill(n){
    if(loaded[n])return;
    loaded[n]=true;
    frames[n].src=srcs[n];
  }
  function go(n){
    if(n<0||n>2)return;
    for(var i=0;i<3;i++){ boxes[i].classList.toggle('active',i===n); }
    fill(n);
    try{ if(frames[n].contentWindow) frames[n].focus(); }catch(e){}
  }
  window.addEventListener('message',function(e){
    if(e.data==='__go_screen__1')go(0);
    else if(e.data==='__go_screen__2')go(1);
    else if(e.data==='__go_screen__3')go(2);
  });
  window.__goScreen=go;
})();
</script>
</body>
</html>
